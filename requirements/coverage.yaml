      - "src/app/api/writing-tasks/dashboard/route.ts"
      - "src/app/tasks/page.tsx"
      - "src/mcp/tools/writing-tasks.ts"
    suggested_requirement: "When the writer selects a capacity on the task dashboard, the system shall show, across all projects, only tasks whose capacity fits, shall suggest up to five ranked by importance, then soonest deadline, then smallest size, shall list upcoming task and opportunity deadlines soonest first, and shall expose the same view through one MCP call."
  - behavior: "Active project limit: project creation fails once a user owns maxActiveProjects unarchived projects (default 3), checked in a serializable transaction; archiving frees a slot."
