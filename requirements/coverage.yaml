orphans:
  - behavior: "Opportunity tracking with candidate entries: record contests before submitting (provider, dates, rules, fee, limits, eligibility, status found/considering/closed), attach projects as candidates, promote a chosen candidate into a contest submission, backfill unlinked submissions (API, MCP, pages; requirement doc 031)."
    code_paths:
      - "src/lib/controllers/opportunities.ts"
      - "src/app/api/opportunities/**"
      - "src/mcp/tools/opportunities.ts"
      - "src/app/opportunities/**"
      - "prisma/schema.prisma"
    suggested_requirement: "When the author records an opportunity, the system shall persist it with provider, close date, rules, limits, eligibility notes and a status of found/considering/closed, shall allow zero or more projects to be attached as candidate entries with their own state and notes, and shall promote a chosen candidate into a contest submission without re-entering captured data."
  - behavior: "Publishing hub resolving one readable state per open contest and per unarchived story from opportunities, candidates and submissions, surfacing missed deadlines, rejected-then-idle stories and simultaneous submissions (requirement doc 031)."
    code_paths:
      - "src/lib/opportunity-state.ts"
      - "src/lib/story-placement.ts"
      - "src/lib/controllers/publishing.ts"
      - "src/app/api/publishing/route.ts"
      - "src/app/publishing/page.tsx"
      - "src/components/story-state-badge.tsx"
      - "src/components/opportunity-state-badge.tsx"
    suggested_requirement: "When the author opens the publishing hub, the system shall present each open contest and each unarchived story with a single state resolved from its opportunity, candidates and submissions, shall distinguish a missed deadline from an open or entered contest and a rejected-then-idle story from one never sent, and shall flag a story that is out with more than one provider at once."
  - behavior: "Subscribable ICS deadline feed of non-closed opportunities as all-day events, authenticated by a per-user regenerable 256-bit token (requirement doc 031)."
    code_paths:
      - "src/lib/controllers/calendar-feed.ts"
      - "src/lib/ics.ts"
      - "src/app/api/calendar/opportunities/[token]/route.ts"
      - "src/app/api/account/calendar-feed/route.ts"
    suggested_requirement: "When a calendar client fetches the author's feed URL, the system shall return an iCalendar document containing every non-closed opportunity as an all-day event on its close date with a self-contained description, authenticated solely by a 256-bit token that the author can regenerate to invalidate prior subscriptions."
  - behavior: "Cross-project writing task dashboard matched to capacity: tasks carry kind, capacity, importance, size, energy, what-is-needed and due date and may exist without a project; dashboard filters by capacity, ranks suggestions, lists upcoming deadlines, groups by project and shows done-this-week; same data via get_task_dashboard MCP tool (requirement doc 032; WCA-016 covers only name and completion)."
