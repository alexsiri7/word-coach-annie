orphans:
- behavior: 'Opportunity tracking: CRUD for calls for submissions with deadlines/limits/eligibility, one candidate entry per project per opportunity, transactional promotion to a contest submission, state-conflict errors, MCP parity.'
  code_paths:
  - src/lib/controllers/opportunities.ts
  - src/lib/opportunity-state.ts
  - src/app/api/opportunities
  - src/app/opportunities/page.tsx
  - src/app/opportunities/[id]/page.tsx
  - src/mcp/tools/opportunities.ts
  - prisma/schema.prisma
  suggested_requirement: When the author records an opportunity for a provider and adds projects to it as candidate entries, the system shall store the opportunity's deadlines, limits and eligibility, allow at most one candidate per project per opportunity, and when a candidate is promoted shall create the linked contest submission in the same transaction, refusing operations the opportunity's current state forbids; equivalent MCP tools shall provide parity.
- behavior: ICS deadline calendar feed served at a per-user secret-token URL as all-day RFC 5545 events, rotatable by regenerating the token.
  code_paths:
  - src/lib/controllers/calendar-feed.ts
  - src/lib/ics.ts
  - src/app/api/calendar/opportunities/[token]/route.ts
  - src/app/api/account/calendar-feed/route.ts
  suggested_requirement: When a calendar client fetches a user's opportunity feed URL, the system shall authenticate it by the URL's unguessable token alone and return a valid iCalendar feed of that user's opportunity deadlines as all-day events; when the user regenerates the feed, the system shall invalidate the previous URL.
- behavior: Cross-project writing-task dashboard filtered by kind and capacity, ranked by due date or nearest opportunity deadline, with suggestions, recently completed tasks and upcoming deadlines.
  code_paths:
  - src/lib/controllers/task-dashboard.ts
  - src/lib/writing-task-ranking.ts
  - src/lib/task-dashboard-groups.ts
  - src/app/api/writing-tasks/dashboard/route.ts
  - src/app/tasks/page.tsx
  suggested_requirement: When the author opens the task dashboard and optionally states their current capacity, task kind or project, the system shall list their open writing tasks across projects grouped by project, keeping only tasks whose capacity fits the stated one, ranked by due date or nearest linked opportunity deadline, with a short suggested list, recently completed tasks, and upcoming open opportunity deadlines.
- behavior: Publishing overview listing where each unarchived story sits, plus a dashboard needs-attention count including deadlines within 14 days.
  code_paths:
  - src/lib/controllers/publishing.ts
  - src/lib/story-placement.ts
  - src/app/api/publishing/route.ts
  - src/app/publishing/page.tsx
  - src/app/page.tsx
  suggested_requirement: When the author opens the publishing overview, the system shall show, for each unarchived project, every candidate entry and submission that records where it currently sits; and the dashboard shall show how many stories or opportunities need attention, including opportunities closing within 14 days.
- behavior: 'Location image gallery: upload or SSRF-guarded remote fetch, 20 MB/25 MP and format limits, metadata-stripped WebP plus thumbnail in R2, served via 1-hour signed URLs without exposing storage paths.'
  code_paths:
  - src/lib/controllers/location-images.ts
  - src/lib/location-images/process.ts
  - src/lib/location-images/fetch-remote.ts
  - src/lib/location-images/files.ts
  - src/lib/storage/object-storage.ts
  - src/app/api/story-objects/[id]/images
  - src/app/api/location-images/[id]
  - src/mcp/tools/location-images.ts
  suggested_requirement: When the author attaches an image to a location by upload or URL, the system shall reject files over 20 MB or 25 megapixels or not in JPEG/PNG/WebP/GIF, refuse URLs that resolve to private or loopback networks, store a metadata-stripped WebP and thumbnail in object storage, let the author caption, classify, reorder and choose a cover image, and serve images only through short-lived signed URLs without revealing storage paths.
- behavior: Top-down location map per location with metre dimensions, optional gallery background and validated items edited serializably, with MCP parity.
  code_paths:
  - src/lib/controllers/location-maps.ts
  - src/app/api/story-objects/[id]/map/route.ts
  - src/mcp/tools/location-maps.ts
  - src/components/location-map
  suggested_requirement: When the author edits a location's map, the system shall store one scaled top-down map per location with an optional background image from the location's gallery and a validated list of items, applying concurrent item edits without lost updates.
- behavior: Game location snapshots (dedup of identical uploads, keep latest 10 per location) and snapshot annotations (note/description/name changes on regions or things, open/sent/done, text survives pruning, bulk mark-sent, review tab).
  code_paths:
  - src/lib/controllers/location-snapshots.ts
  - src/lib/location-snapshots/slug.ts
  - src/app/api/projects/[id]/locations/[slug]/snapshots
  - src/app/api/location-snapshots
  - src/app/api/snapshot-annotations/[id]
  - src/app/api/projects/[id]/snapshot-annotations/sent
  - src/mcp/tools/location-snapshots.ts
  - src/components/location-snapshots
  suggested_requirement: When a game posts a location snapshot, the system shall store it unless it is identical to the latest one, keep only the 10 most recently received snapshots per location, and let the author annotate regions or things with notes or name/description changes whose text survives pruning; when annotations are marked sent, the system shall record that status for the project's listed annotations.
- behavior: Project annotations overview page listing every annotation in a project.
  code_paths:
  - src/app/project/[id]/annotations/page.tsx
  - src/app/api/annotations/route.ts
  suggested_requirement: When the author opens a project's annotations page, the system shall list every annotation in the project with its scene and selected text and allow each to be opened, resolved or deleted.
- behavior: Connect Claude Code setup page (/setup) with MCP connection instructions; WCA-062 notes explicitly exclude it.
  code_paths:
  - src/app/setup/page.tsx
  suggested_requirement: The system shall provide a setup page giving a signed-in user the instructions and endpoint needed to connect an MCP client such as Claude Code to their account.
