services:
  app:
    build:
      context: .
      dockerfile: Dockerfile.dev
    restart: unless-stopped
    ports:
      - "127.0.0.1:3000:3000"
    volumes:
      # Mount source code for hot reload
      - .:/app
      # Prevent node_modules from being overwritten by mount
      - /app/node_modules
    environment:
      - NODE_ENV=development
      - OTEL_ENABLED=true
      - PHOENIX_COLLECTOR_ENDPOINT=http://phoenix:6006/v1/traces
    command: sh -c "npx prisma generate && node scripts/migrate.mjs && npm run dev:lan"
    depends_on:
      - phoenix

  phoenix:
    # Same digest as docker-compose.yml; update both together.
    image: arizephoenix/phoenix@sha256:91bb10c1217cd1fc0b3ac5908cc8d11f663bc56e00241b7f7551af880d5bcd92
    restart: unless-stopped
    ports:
      - "127.0.0.1:6006:6006"
    volumes:
      - phoenix-data:/data

volumes:
  phoenix-data:
