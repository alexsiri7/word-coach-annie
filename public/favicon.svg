<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" fill="none">
  <!-- Background rounded square -->
  <rect width="32" height="32" rx="6" fill="#0f172a"/>
  <!-- Typewriter body -->
  <rect x="6" y="16" width="20" height="10" rx="2" fill="#1e293b" stroke="#475569" stroke-width="0.8"/>
  <!-- Keyboard dots row 1 -->
  <circle cx="10" cy="20" r="1" fill="#64748b"/>
  <circle cx="14" cy="20" r="1" fill="#64748b"/>
  <circle cx="18" cy="20" r="1" fill="#64748b"/>
  <circle cx="22" cy="20" r="1" fill="#64748b"/>
  <!-- Keyboard dots row 2 -->
  <circle cx="12" cy="23" r="1" fill="#64748b"/>
  <circle cx="16" cy="23" r="1" fill="#64748b"/>
  <circle cx="20" cy="23" r="1" fill="#64748b"/>
  <!-- Paper -->
  <rect x="9" y="8" width="14" height="10" rx="1" fill="#cbd5e1"/>
  <line x1="11" y1="11" x2="21" y2="11" stroke="#94a3b8" stroke-width="0.6" stroke-linecap="round"/>
  <line x1="11" y1="13.5" x2="19" y2="13.5" stroke="#94a3b8" stroke-width="0.6" stroke-linecap="round"/>
  <!-- Pen diagonal -->
  <g transform="translate(18, 4) rotate(35)">
    <rect x="0" y="0" width="3" height="14" rx="1" fill="#6366f1"/>
    <polygon points="0,14 3,14 1.5,17.5" fill="#6366f1"/>
    <rect x="0" y="0" width="3" height="2.5" rx="0.8" fill="#4f46e5"/>
  </g>
</svg>
