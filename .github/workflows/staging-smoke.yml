name: Staging → Production Pipeline

on:
  workflow_run:
    workflows: ["CI"]
    types: [completed]
    branches: [main]
  workflow_dispatch:

jobs:
  # ── Stage 1: Validate staging ─────────────────────────────────────────
  staging-e2e:
    name: Staging E2E Tests
    runs-on: ubuntu-latest
    if: >
      github.event_name == 'workflow_dispatch' ||
      github.event.workflow_run.conclusion == 'success'
    steps:
      - name: Wait for healthy staging deploy
        run: |
          MAX_ATTEMPTS=20       # 20 × 30s = 10 minutes max
          INTERVAL=30
          echo "Polling staging health every ${INTERVAL}s (up to ${MAX_ATTEMPTS} attempts / 10 min)..."
          for i in $(seq 1 $MAX_ATTEMPTS); do
            STATUS=$(curl -s -o /dev/null -w "%{http_code}" --max-time 15 \
              -H "Authorization: Bearer ${{ secrets.API_TOKEN }}" \
              https://word-coach-annie-staging.up.railway.app/api/health)
            if [ "$STATUS" = "200" ]; then
              echo "✓ Staging health check passed after $((i * INTERVAL))s"
              break
            fi
            echo "Attempt $i/$MAX_ATTEMPTS: HTTP $STATUS, retrying in ${INTERVAL}s..."
            sleep $INTERVAL
            if [ "$i" = "$MAX_ATTEMPTS" ]; then
              echo "::error::Staging health check failed after $MAX_ATTEMPTS attempts"
              exit 1
            fi
          done

      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browsers
        run: npx playwright install chromium

      - name: Run E2E integration tests against staging
        run: npx playwright test e2e/integration.spec.ts --project=integration
        env:
          BASE_URL: https://word-coach-annie-staging.up.railway.app
          API_TOKEN: ${{ secrets.API_TOKEN }}

  # ── Stage 2: Deploy to production ─────────────────────────────────────
  deploy-production:
    name: Deploy to Production
    runs-on: ubuntu-latest
    needs: staging-e2e
    steps:
      - name: Verify staging deployment succeeded
        id: staging-check
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
          RAILWAY_PROJECT_ID: ${{ secrets.RAILWAY_PROJECT_ID }}
          RAILWAY_STAGING_SERVICE_ID: ${{ secrets.RAILWAY_STAGING_SERVICE_ID }}
          RAILWAY_STAGING_ENVIRONMENT_ID: ${{ secrets.RAILWAY_STAGING_ENVIRONMENT_ID }}
        run: |
          if [ -z "$RAILWAY_TOKEN" ]; then
            echo "::error::RAILWAY_TOKEN not set — cannot deploy to production"
            echo "::error::Create one at https://railway.com/account/tokens and save as RAILWAY_TOKEN secret"
            exit 1
          fi

          echo "Fetching latest staging deployment..."
          RESPONSE=$(curl -s -X POST https://backboard.railway.app/graphql/v2 \
            -H "Authorization: Bearer $RAILWAY_TOKEN" \
            -H "Content-Type: application/json" \
            -d "{
              \"query\": \"query { deployments(input: { projectId: \\\"$RAILWAY_PROJECT_ID\\\", serviceId: \\\"$RAILWAY_STAGING_SERVICE_ID\\\", environmentId: \\\"$RAILWAY_STAGING_ENVIRONMENT_ID\\\" }, first: 1) { edges { node { id status meta } } } }\"
            }")

          STAGING_STATUS=$(echo "$RESPONSE" | jq -r '.data.deployments.edges[0].node.status // empty')
          COMMIT=$(echo "$RESPONSE" | jq -r '.data.deployments.edges[0].node.meta.commitHash // empty')

          if [ "$STAGING_STATUS" != "SUCCESS" ]; then
            echo "::error::Latest staging deployment status is '$STAGING_STATUS', expected 'SUCCESS'"
            exit 1
          fi

          echo "commit=$COMMIT" >> "$GITHUB_OUTPUT"
          echo "✓ Staging deployment succeeded (commit: ${COMMIT:0:7})"

      - name: Deploy staging commit to production
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
          RAILWAY_SERVICE_ID: ${{ secrets.RAILWAY_SERVICE_ID }}
          RAILWAY_ENVIRONMENT_ID: ${{ secrets.RAILWAY_ENVIRONMENT_ID }}
        run: |
          COMMIT="${{ steps.staging-check.outputs.commit }}"
          if [ -z "$COMMIT" ]; then
            echo "::error::No commit SHA from staging check"
            exit 1
          fi

          echo "Deploying commit $COMMIT to production (same commit as staging)..."

          RESPONSE=$(curl -s -X POST https://backboard.railway.app/graphql/v2 \
            -H "Authorization: Bearer $RAILWAY_TOKEN" \
            -H "Content-Type: application/json" \
            -d "{
              \"query\": \"mutation { serviceInstanceDeployV2(serviceId: \\\"$RAILWAY_SERVICE_ID\\\", environmentId: \\\"$RAILWAY_ENVIRONMENT_ID\\\", commitSha: \\\"$COMMIT\\\") }\"
            }")

          echo "Response: $RESPONSE"

          ERRORS=$(echo "$RESPONSE" | jq -r '.errors // empty')
          if [ -n "$ERRORS" ] && [ "$ERRORS" != "null" ]; then
            echo "::error::Railway API error: $ERRORS"
            exit 1
          fi

          echo "✓ Production deploy triggered for commit ${COMMIT:0:7}"

  # ── Stage 3: Verify production ────────────────────────────────────────
  health-check:
    name: Production Health Check
    runs-on: ubuntu-latest
    needs: deploy-production
    outputs:
      healthy: ${{ steps.check.outputs.healthy }}
      status: ${{ steps.check.outputs.status }}
    steps:
      - name: Poll for healthy production deploy
        id: check
        run: |
          HEALTH_URL="https://annie.interstellarai.net/api/health"
          MAX_ATTEMPTS=20       # 20 × 30s = 10 minutes max
          INTERVAL=30

          echo "Polling production health every ${INTERVAL}s (up to ${MAX_ATTEMPTS} attempts / 10 min)..."
          for i in $(seq 1 $MAX_ATTEMPTS); do
            BODY=$(curl -s --max-time 15 "$HEALTH_URL" || echo '{"status":"unreachable"}')
            STATUS=$(echo "$BODY" | jq -r '.status // "unknown"')
            echo "Attempt $i/$MAX_ATTEMPTS: status=$STATUS"

            if [ "$STATUS" = "ok" ]; then
              echo "healthy=true" >> "$GITHUB_OUTPUT"
              echo "status=$STATUS" >> "$GITHUB_OUTPUT"
              echo "✓ Production health check passed after $((i * INTERVAL))s"
              exit 0
            fi

            sleep $INTERVAL
          done

          echo "healthy=false" >> "$GITHUB_OUTPUT"
          echo "status=$STATUS" >> "$GITHUB_OUTPUT"
          echo "::error::Production health check failed after $MAX_ATTEMPTS attempts (status: $STATUS)"

  # ── Stage 4: Rollback if unhealthy ────────────────────────────────────
  rollback:
    name: Rollback Production
    runs-on: ubuntu-latest
    needs: health-check
    if: needs.health-check.outputs.healthy == 'false'
    steps:
      - name: Attempt Railway rollback
        id: rollback
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
          RAILWAY_PROJECT_ID: ${{ secrets.RAILWAY_PROJECT_ID }}
          RAILWAY_SERVICE_ID: ${{ secrets.RAILWAY_SERVICE_ID }}
          RAILWAY_ENVIRONMENT_ID: ${{ secrets.RAILWAY_ENVIRONMENT_ID }}
        run: |
          if [ -z "$RAILWAY_TOKEN" ]; then
            echo "::warning::RAILWAY_TOKEN not set, skipping automated rollback"
            echo "rollback_attempted=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          echo "Fetching latest deployments..."
          RESPONSE=$(curl -s -X POST https://backboard.railway.app/graphql/v2 \
            -H "Authorization: Bearer $RAILWAY_TOKEN" \
            -H "Content-Type: application/json" \
            -d "{
              \"query\": \"query { deployments(input: { projectId: \\\"$RAILWAY_PROJECT_ID\\\", serviceId: \\\"$RAILWAY_SERVICE_ID\\\", environmentId: \\\"$RAILWAY_ENVIRONMENT_ID\\\" }, first: 2) { edges { node { id status } } } }\"
            }")

          echo "Deployments response: $RESPONSE"

          CURRENT_ID=$(echo "$RESPONSE" | jq -r '.data.deployments.edges[0].node.id // empty')
          if [ -z "$CURRENT_ID" ]; then
            echo "::warning::Could not find current deployment to rollback"
            echo "rollback_attempted=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          echo "Rolling back deployment $CURRENT_ID..."
          ROLLBACK=$(curl -s -X POST https://backboard.railway.app/graphql/v2 \
            -H "Authorization: Bearer $RAILWAY_TOKEN" \
            -H "Content-Type: application/json" \
            -d "{
              \"query\": \"mutation { deploymentRollback(id: \\\"$CURRENT_ID\\\") }\"
            }")

          echo "Rollback response: $ROLLBACK"

          ERRORS=$(echo "$ROLLBACK" | jq -r '.errors // empty')
          if [ -n "$ERRORS" ] && [ "$ERRORS" != "null" ]; then
            echo "::warning::Rollback API returned errors: $ERRORS"
            echo "rollback_attempted=true" >> "$GITHUB_OUTPUT"
            echo "rollback_succeeded=false" >> "$GITHUB_OUTPUT"
          else
            echo "✓ Rollback initiated successfully"
            echo "rollback_attempted=true" >> "$GITHUB_OUTPUT"
            echo "rollback_succeeded=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Send ntfy alert
        if: always()
        env:
          NTFY_URL: ${{ secrets.NTFY_URL }}
        run: |
          if [ -z "$NTFY_URL" ]; then exit 0; fi
          STATUS="${{ needs.health-check.outputs.status }}"
          SHA="${{ github.sha }}"
          SHORT_SHA="${SHA:0:7}"
          ROLLBACK="${{ steps.rollback.outputs.rollback_succeeded }}"
          if [ "$ROLLBACK" = "true" ]; then
            MSG="Rollback initiated. Verify production is healthy."
          else
            MSG="Rollback failed or not attempted. Manual intervention required."
          fi
          curl -s \
            -H "Priority: urgent" \
            -H "Tags: warning,rotating_light" \
            -H "Title: Annie Deploy Failed (${SHORT_SHA})" \
            -d "Health check: ${STATUS}. ${MSG} https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}" \
            "$NTFY_URL"

      - name: Create failure issue
        if: always()
        uses: actions/github-script@v7
        with:
          script: |
            const status = '${{ needs.health-check.outputs.status }}';
            const rollbackAttempted = '${{ steps.rollback.outputs.rollback_attempted }}' === 'true';
            const rollbackSucceeded = '${{ steps.rollback.outputs.rollback_succeeded }}' === 'true';
            const sha = context.sha || context.payload?.workflow_run?.head_sha || 'unknown';
            const shortSha = sha.substring(0, 7);

            let rollbackSection;
            if (rollbackSucceeded) {
              rollbackSection = '**Automatic rollback was initiated.** Verify production is healthy.';
            } else if (rollbackAttempted) {
              rollbackSection = '**Automatic rollback was attempted but may have failed.** Manual intervention required.';
            } else {
              rollbackSection = '**Automatic rollback was not attempted** (RAILWAY_TOKEN not configured). Manual rollback required.';
            }

            const body = [
              `## Production Deploy Failed`,
              ``,
              `Health check returned \`${status}\` after deploy of ${shortSha}.`,
              ``,
              rollbackSection,
              ``,
              `### Manual rollback steps`,
              `1. Go to [Railway Dashboard](https://railway.app) > Annie project > Deployments`,
              `2. Find the last known-good deployment and click "Rollback"`,
              `3. Or revert the commit: \`git revert ${shortSha} && git push origin main\``,
              ``,
              `### Investigation`,
              `- Check [production health](https://annie.interstellarai.net/api/health)`,
              `- Check Railway deploy logs`,
              `- Check Supabase dashboard for DB issues`,
              ``,
              `Triggered by workflow run: ${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`,
            ].join('\n');

            await github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: `Production deploy failed — health check ${status} (${shortSha})`,
              body: body,
              labels: ['bug', 'production'],
            });
