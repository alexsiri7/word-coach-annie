name: Pipeline Deploy Watchdog

on:
  schedule:
    - cron: '*/15 * * * *'
  workflow_dispatch:

concurrency:
  group: pipeline-watchdog
  cancel-in-progress: false

permissions:
  contents: read
  actions: write  # needed for workflow dispatch

jobs:
  check-and-redispatch:
    name: Re-dispatch pipeline if workflow_run was dropped
    runs-on: ubuntu-latest
    steps:
      - name: Check if pipeline needs re-dispatch
        id: check
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          REPO="${{ github.repository }}"

          # Get current main HEAD SHA
          MAIN_SHA=$(gh api repos/$REPO/git/ref/heads/main --jq '.object.sha')
          echo "Main HEAD: $MAIN_SHA"
          echo "main_sha=$MAIN_SHA" >> "$GITHUB_OUTPUT"

          # Check if CI succeeded for this SHA
          CI_RUN=$(gh run list \
            --repo "$REPO" \
            --workflow=ci.yml \
            --branch main \
            --commit "$MAIN_SHA" \
            --status success \
            --limit 1 \
            --json databaseId,conclusion \
            --jq '.[0].databaseId // empty')

          if [ -z "$CI_RUN" ]; then
            echo "No successful CI run for $MAIN_SHA yet — nothing to dispatch"
            echo "redispatched=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "CI succeeded for $MAIN_SHA (run $CI_RUN)"

          # Check if pipeline is currently in-flight (in_progress or queued) for this SHA.
          # We intentionally do NOT exit 0 on cancelled/failed runs — those warrant re-dispatch.
          PIPELINE_ACTIVE=$(gh run list \
            --repo "$REPO" \
            --workflow=staging-smoke.yml \
            --commit "$MAIN_SHA" \
            --status in_progress \
            --limit 1 \
            --json databaseId \
            --jq '.[0].databaseId // empty')

          if [ -n "$PIPELINE_ACTIVE" ]; then
            echo "Pipeline run $PIPELINE_ACTIVE is in progress for $MAIN_SHA — nothing to do"
            echo "redispatched=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          PIPELINE_QUEUED=$(gh run list \
            --repo "$REPO" \
            --workflow=staging-smoke.yml \
            --commit "$MAIN_SHA" \
            --status queued \
            --limit 1 \
            --json databaseId \
            --jq '.[0].databaseId // empty')

          if [ -n "$PIPELINE_QUEUED" ]; then
            echo "Pipeline run $PIPELINE_QUEUED is queued for $MAIN_SHA — nothing to do"
            echo "redispatched=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          echo "No active pipeline run for $MAIN_SHA despite CI success — re-dispatching"
          gh workflow run staging-smoke.yml --repo "$REPO" --ref main
          echo "Re-dispatch triggered"
          echo "redispatched=true" >> "$GITHUB_OUTPUT"

      - name: Notify on re-dispatch
        if: steps.check.outputs.redispatched == 'true'
        continue-on-error: true
        env:
          NTFY_URL: ${{ secrets.NTFY_URL }}
        run: |
          if [ -z "$NTFY_URL" ]; then exit 0; fi
          curl -s -X POST "$NTFY_URL" \
            -H "Title: Pipeline watchdog re-dispatched" \
            -H "Priority: high" \
            -H "Tags: warning" \
            -d "CI succeeded for ${{ github.repository }} (SHA: ${{ steps.check.outputs.main_sha }}) but no active pipeline run existed. Re-dispatched staging-smoke.yml."
