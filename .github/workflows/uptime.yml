name: Uptime Monitor

on:
  schedule:
    - cron: '*/5 * * * *' # Every 5 minutes
  workflow_dispatch: # Manual trigger

jobs:
  check-production:
    name: Production Health Check
    runs-on: ubuntu-latest
    steps:
      - name: Check health + data integrity
        id: check
        run: |
          BODY=$(curl -s --max-time 10 https://annie.interstellarai.net/api/health)
          STATUS=$(echo "$BODY" | jq -r '.status // "unknown"')
          echo "status=$STATUS" >> "$GITHUB_OUTPUT"
          echo "Response: $BODY"
          if [ "$STATUS" = "error" ]; then
            echo "::error::Production health check failed — DB unreachable"
            exit 1
          fi
          if [ "$STATUS" = "degraded" ]; then
            echo "::error::Production database appears empty — possible data loss!"
            exit 1
          fi
          echo "Production health check passed (status: $STATUS)"

      - name: Notify on failure
        if: failure()
        continue-on-error: true
        env:
          NTFY_URL: ${{ secrets.NTFY_URL }}
        run: |
          if [ -z "$NTFY_URL" ]; then exit 0; fi
          STATUS="${{ steps.check.outputs.status }}"
          curl -s \
            -H "Priority: urgent" \
            -H "Tags: warning,rotating_light" \
            -H "Title: Annie Production Down" \
            -d "Health check failed (status: ${STATUS}). Check: https://annie.interstellarai.net/api/health" \
            "$NTFY_URL"

  check-staging:
    name: Staging Health Check
    runs-on: ubuntu-latest
    steps:
      - name: Check health endpoint
        id: check
        run: |
          BODY=$(curl -s --max-time 10 https://word-coach-annie-staging.up.railway.app/api/health)
          STATUS=$(echo "$BODY" | jq -r '.status // "unknown"')
          echo "status=$STATUS" >> "$GITHUB_OUTPUT"
          echo "Response: $BODY"
          if [ "$STATUS" = "error" ]; then
            echo "::error::Staging health check failed — DB unreachable"
            exit 1
          fi
          echo "Staging health check passed (status: $STATUS)"

      - name: Notify on failure
        if: failure()
        continue-on-error: true
        env:
          NTFY_URL: ${{ secrets.NTFY_URL }}
        run: |
          if [ -z "$NTFY_URL" ]; then exit 0; fi
          STATUS="${{ steps.check.outputs.status }}"
          curl -s \
            -H "Priority: urgent" \
            -H "Tags: warning,rotating_light" \
            -H "Title: Annie Staging Down" \
            -d "Health check failed (status: ${STATUS}). Check: https://word-coach-annie-staging.up.railway.app/api/health" \
            "$NTFY_URL"
