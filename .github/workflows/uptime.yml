name: Uptime Monitor

on:
  schedule:
    - cron: '*/5 * * * *' # Every 5 minutes
  workflow_dispatch: # Manual trigger

permissions:
  contents: read

jobs:
  check-production:
    name: Production Health Check
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: write
    steps:
      - name: Check health + data integrity
        id: check
        run: |
          MAX_ATTEMPTS=3
          ATTEMPT=0
          STATUS="unreachable"
          while [ $ATTEMPT -lt $MAX_ATTEMPTS ]; do
            ATTEMPT=$(( ATTEMPT + 1 ))
            BODY=$(curl -s --max-time 10 https://annie.interstellarai.net/api/health || echo '{"status":"unreachable"}')
            STATUS=$(echo "$BODY" | jq -r '.status // "unknown"' 2>/dev/null || echo "unreachable")
            echo "Attempt $ATTEMPT/$MAX_ATTEMPTS — Response: $BODY"
            if [ "$STATUS" != "unreachable" ]; then
              break
            fi
            if [ $ATTEMPT -lt $MAX_ATTEMPTS ]; then
              echo "Server unreachable, retrying in 15s..."
              sleep 15
            fi
          done
          echo "status=$STATUS" >> "$GITHUB_OUTPUT"
          if [ "$STATUS" = "unreachable" ]; then
            echo "::error::Production health check failed — server unreachable or response unparseable after $MAX_ATTEMPTS attempts"
            exit 1
          fi
          if [ "$STATUS" = "error" ]; then
            echo "::error::Production health check failed — DB unreachable"
            exit 1
          fi
          if [ "$STATUS" = "degraded" ]; then
            echo "::error::Production database appears empty — possible data loss!"
            exit 1
          fi
          echo "Production health check passed (status: $STATUS)"

      - name: Notify on failure
        if: failure()
        continue-on-error: true
        env:
          NTFY_URL: ${{ secrets.NTFY_URL }}
        run: |
          if [ -z "$NTFY_URL" ]; then exit 0; fi
          STATUS="${{ steps.check.outputs.status }}"
          curl -s \
            -H "Priority: urgent" \
            -H "Tags: warning,rotating_light" \
            -H "Title: Annie Production Down" \
            -d "Health check failed (status: ${STATUS}). Check: https://annie.interstellarai.net/api/health" \
            "$NTFY_URL"

      - name: Auto-close stale Deploy down issues
        if: success()
        uses: actions/github-script@v7
        with:
          script: |
            // External uptime monitors open "Deploy down: <URL> returning HTTP <code>" issues
            // on transient blips and never close them. When this in-repo probe passes,
            // close any such open issues for the production URL (mirrors the backup-alert
            // auto-close pattern in the check-backup-freshness job below).
            const titlePrefix = 'Deploy down: https://annie.interstellarai.net/api/health';

            const { data: issues } = await github.rest.issues.listForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: 'open',
              labels: 'bug',
              per_page: 100,
            });

            const stale = issues.filter(i => !i.pull_request && i.title.startsWith(titlePrefix));

            if (stale.length === 0) {
              console.log('No stale Deploy down issues to close.');
              return;
            }

            for (const issue of stale) {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: issue.number,
                body: [
                  '✅ Production health check passed — auto-closing stale alert.',
                  '',
                  `Endpoint \`https://annie.interstellarai.net/api/health\` returned \`status: ok\` from the in-repo uptime probe at ${new Date().toISOString()}.`,
                  '',
                  `Triggered by workflow run: ${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`,
                ].join('\n'),
              });
              await github.rest.issues.update({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: issue.number,
                state: 'closed',
                state_reason: 'completed',
              });
              console.log(`Closed stale Deploy down issue #${issue.number}`);
            }

  check-staging:
    name: Staging Health Check
    runs-on: ubuntu-latest
    steps:
      - name: Check health endpoint
        id: check
        run: |
          MAX_ATTEMPTS=3
          ATTEMPT=0
          STATUS="unreachable"
          while [ $ATTEMPT -lt $MAX_ATTEMPTS ]; do
            ATTEMPT=$(( ATTEMPT + 1 ))
            BODY=$(curl -s --max-time 10 https://word-coach-annie-staging.up.railway.app/api/health || echo '{"status":"unreachable"}')
            STATUS=$(echo "$BODY" | jq -r '.status // "unknown"' 2>/dev/null || echo "unreachable")
            echo "Attempt $ATTEMPT/$MAX_ATTEMPTS — Response: $BODY"
            if [ "$STATUS" != "unreachable" ]; then
              break
            fi
            if [ $ATTEMPT -lt $MAX_ATTEMPTS ]; then
              echo "Server unreachable, retrying in 15s..."
              sleep 15
            fi
          done
          echo "status=$STATUS" >> "$GITHUB_OUTPUT"
          if [ "$STATUS" = "unreachable" ]; then
            echo "::error::Staging health check failed — server unreachable or response unparseable after $MAX_ATTEMPTS attempts"
            exit 1
          fi
          if [ "$STATUS" = "error" ]; then
            echo "::error::Staging health check failed — DB unreachable"
            exit 1
          fi
          echo "Staging health check passed (status: $STATUS)"

      - name: Notify on failure
        if: failure()
        continue-on-error: true
        env:
          NTFY_URL: ${{ secrets.NTFY_URL }}
        run: |
          if [ -z "$NTFY_URL" ]; then exit 0; fi
          STATUS="${{ steps.check.outputs.status }}"
          curl -s \
            -H "Priority: urgent" \
            -H "Tags: warning,rotating_light" \
            -H "Title: Annie Staging Down" \
            -d "Health check failed (status: ${STATUS}). Check: https://word-coach-annie-staging.up.railway.app/api/health" \
            "$NTFY_URL"

  check-backup-freshness:
    name: Backup Freshness Check
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: write
    steps:
      - name: Check Supabase backup age
        id: backup-check
        env:
          SUPABASE_PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF }}
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: |
          if [ -z "$SUPABASE_PROJECT_REF" ] || [ -z "$SUPABASE_ACCESS_TOKEN" ]; then
            echo "::warning::SUPABASE_PROJECT_REF or SUPABASE_ACCESS_TOKEN not set — skipping backup freshness check"
            echo "stale=false" >> "$GITHUB_OUTPUT"
            echo "configured=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          RESPONSE=$(curl -s --max-time 15 \
            -H "Authorization: Bearer $SUPABASE_ACCESS_TOKEN" \
            -H "Content-Type: application/json" \
            "https://api.supabase.com/v1/projects/$SUPABASE_PROJECT_REF/database/backups")

          # Supabase GET /v1/projects/{ref}/database/backups returns a bare JSON array:
          # [{"id": "...", "inserted_at": "2024-01-15T10:30:00Z", "status": "COMPLETED", ...}]
          # Field name 'inserted_at' verified against Supabase Management API v1.
          NEWEST_TS=$(echo "$RESPONSE" | jq -r '
            if type == "array" and length > 0
            then [.[].inserted_at] | sort | last
            else null
            end')

          echo "Newest backup timestamp: $NEWEST_TS"

          if [ -z "$NEWEST_TS" ] || [ "$NEWEST_TS" = "null" ]; then
            echo "::error::No backups found via Supabase API — possible backup system failure"
            echo "stale=true" >> "$GITHUB_OUTPUT"
            echo "reason=No backups found" >> "$GITHUB_OUTPUT"
            echo "configured=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          NOW=$(date +%s)
          BACKUP_TIME=$(date -d "$NEWEST_TS" +%s)
          AGE_SECONDS=$(( NOW - BACKUP_TIME ))
          AGE_HOURS=$(( AGE_SECONDS / 3600 ))
          echo "configured=true" >> "$GITHUB_OUTPUT"

          echo "Newest backup: $NEWEST_TS (${AGE_HOURS}h ago)"

          if [ "$AGE_SECONDS" -gt 21600 ]; then
            echo "::error::Backup is stale — newest backup is ${AGE_HOURS}h old (threshold: 6h)"
            echo "stale=true" >> "$GITHUB_OUTPUT"
            echo "reason=Newest backup is ${AGE_HOURS}h old (threshold: 6h)" >> "$GITHUB_OUTPUT"
            echo "newest_ts=$NEWEST_TS" >> "$GITHUB_OUTPUT"
          else
            echo "Backup freshness check passed — newest backup is ${AGE_HOURS}h old"
            echo "stale=false" >> "$GITHUB_OUTPUT"
            echo "newest_ts=$NEWEST_TS" >> "$GITHUB_OUTPUT"
          fi

      - name: Alert or resolve backup staleness
        if: steps.backup-check.outputs.configured == 'true'
        uses: actions/github-script@v7
        env:
          STALE: ${{ steps.backup-check.outputs.stale }}
          REASON: ${{ steps.backup-check.outputs.reason }}
          NEWEST_TS: ${{ steps.backup-check.outputs.newest_ts }}
        with:
          script: |
            const isStale = process.env.STALE === 'true';
            const reason = process.env.REASON || 'unknown';
            const newestTs = process.env.NEWEST_TS || 'unknown';
            const label = 'backup-alert';

            // Ensure the label exists (self-bootstrapping — creates it if absent)
            try {
              await github.rest.issues.getLabel({
                owner: context.repo.owner,
                repo: context.repo.repo,
                name: label,
              });
            } catch (e) {
              if (e.status === 404) {
                await github.rest.issues.createLabel({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  name: label,
                  color: 'e11d48',
                  description: 'Automated backup freshness alert',
                });
              }
            }

            // Find any existing open backup-alert issues
            const existing = await github.rest.issues.listForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              labels: label,
              state: 'open',
            });

            if (isStale) {
              if (existing.data.length > 0) {
                console.log(`Backup still stale — issue #${existing.data[0].number} already open, skipping duplicate`);
                return;
              }

              const body = [
                '## Backup Staleness Alert',
                '',
                `**Reason**: ${reason}`,
                `**Last backup**: ${newestTs}`,
                `**Detected**: ${new Date().toISOString()}`,
                '',
                '### Investigation Steps',
                '1. Check the mayor server backup cron: `/home/asiri/gt/mayor/scripts/backup-dbs.sh`',
                '2. Check cron logs: `crontab -l` and review backup logs',
                '3. Check Supabase Dashboard → Database → Backups for backup status',
                '4. Verify Supabase project health at https://supabase.com/dashboard',
                '',
                `Triggered by workflow run: ${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`,
              ].join('\n');

              await github.rest.issues.create({
                owner: context.repo.owner,
                repo: context.repo.repo,
                title: `Backup staleness alert — ${reason}`,
                body,
                labels: [label],
              });

              console.log('Created backup-alert issue');
            } else {
              // Resolve any open issues
              for (const issue of existing.data) {
                await github.rest.issues.createComment({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  issue_number: issue.number,
                  body: `✅ Backup freshness restored — newest backup: ${newestTs}. Closing.`,
                });
                await github.rest.issues.update({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  issue_number: issue.number,
                  state: 'closed',
                });
                console.log(`Closed resolved backup-alert issue #${issue.number}`);
              }
            }
