name: Uptime Monitor

on:
  schedule:
    - cron: '*/5 * * * *' # Every 5 minutes
  workflow_dispatch: # Manual trigger

jobs:
  check-production:
    name: Production Health Check
    runs-on: ubuntu-latest
    steps:
      - name: Check health endpoint
        run: |
          STATUS=$(curl -s -o /dev/null -w "%{http_code}" --max-time 10 https://annie.interstellarai.net/api/health)
          if [ "$STATUS" != "200" ]; then
            echo "::error::Production health check failed with status $STATUS"
            exit 1
          fi
          echo "Production health check passed (HTTP $STATUS)"

  check-staging:
    name: Staging Health Check
    runs-on: ubuntu-latest
    steps:
      - name: Check health endpoint
        run: |
          STATUS=$(curl -s -o /dev/null -w "%{http_code}" --max-time 10 https://amusing-blessing-staging.up.railway.app/api/health)
          if [ "$STATUS" != "200" ]; then
            echo "::error::Staging health check failed with status $STATUS"
            exit 1
          fi
          echo "Staging health check passed (HTTP $STATUS)"
