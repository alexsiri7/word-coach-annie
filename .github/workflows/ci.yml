name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: alexsiri7/word-coach-annie

jobs:
  quality:
    name: Quality Gates (Node 20)
    runs-on: ubuntu-latest
    env:
      NODE_OPTIONS: --max-old-space-size=4096
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Cache node_modules
        uses: actions/cache@v4
        with:
          path: node_modules
          key: ${{ runner.os }}-node-${{ hashFiles('package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-node-

      - name: Setup
        run: ./scripts/gates.sh setup

      - name: Lint
        run: ./scripts/gates.sh lint

      - name: Typecheck
        run: ./scripts/gates.sh typecheck

      - name: Test
        run: ./scripts/gates.sh test

      - name: Build
        run: ./scripts/gates.sh build

  deploy:
    name: Deploy to server
    runs-on: ubuntu-latest
    needs: [quality]
    if: github.event_name == 'push' && github.ref == 'refs/heads/master'
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=sha,prefix=
            type=raw,value=latest

      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Connect to Tailscale
        uses: tailscale/github-action@v4
        with:
          authkey: ${{ secrets.TAILSCALE_AUTHKEY }}

      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1
        env:
          GHCR_PAT: ${{ secrets.GHCR_PAT }}
        with:
          host: 100.120.193.82
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.SSH_DEPLOY_KEY }}
          envs: GHCR_PAT
          script: |
            cd /home/asiri/gt/annie/mayor/rig

            # Pull latest compose file
            git pull --rebase

            # Authenticate with GHCR
            echo "$GHCR_PAT" | docker login ghcr.io -u alexsiri7 --password-stdin

            # Tag current running image as rollback before pulling new one
            docker tag ghcr.io/alexsiri7/word-coach-annie:latest \
              ghcr.io/alexsiri7/word-coach-annie:rollback 2>/dev/null || true

            # Pull the new image
            docker pull ghcr.io/alexsiri7/word-coach-annie:latest

            # Restart with new image
            docker compose up -d app

            # Verify the new container is healthy (wait up to 30s)
            echo "Waiting for container to start..."
            for i in $(seq 1 6); do
              if docker compose exec app curl -sf http://localhost:3000 > /dev/null 2>&1; then
                echo "Deploy successful!"
                exit 0
              fi
              sleep 5
            done

            echo "WARNING: Health check did not pass within 30s"
            echo "To rollback: docker compose down && docker tag ghcr.io/alexsiri7/word-coach-annie:rollback ghcr.io/alexsiri7/word-coach-annie:latest && docker compose up -d app"
            exit 1
