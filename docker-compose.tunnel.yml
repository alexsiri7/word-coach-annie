# Publishes the dev server through a Cloudflare tunnel. Overlay on the dev stack:
#   docker compose -f docker-compose.dev.yml -f docker-compose.tunnel.yml up
# Compose refuses to start without API_TOKEN, and passes it to the app so the
# tunnel never exposes it with auth disabled.
services:
  app:
    environment:
      - API_TOKEN=${API_TOKEN:?set API_TOKEN before exposing the dev server through the tunnel}

  tunnel:
    image: cloudflare/cloudflared:2026.10.6@sha256:004d843fa5fdc3103983fd580ee19fab4a8fa98add31f87249c1659e848c98e0
    restart: always
    environment:
      - TUNNEL_TOKEN=${CLOUDFLARE_TUNNEL_TOKEN:?set CLOUDFLARE_TUNNEL_TOKEN}
    command: tunnel --no-autoupdate run
    depends_on:
      - app
