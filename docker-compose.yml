services:
  app:
    image: ghcr.io/alexsiri7/word-coach-annie:latest
    restart: unless-stopped
    ports:
      - "127.0.0.1:3000:3000"
    volumes:
      # Persist SQLite database outside the container
      - ./data:/app/data
    env_file:
      - .env.local
    environment:
      - NODE_ENV=production
      - DATABASE_URL=file:/app/data/word-coach-annie.db
      - OTEL_ENABLED=true
      - PHOENIX_COLLECTOR_ENDPOINT=http://phoenix:6006/v1/traces
    depends_on:
      - phoenix

  phoenix:
    image: arizephoenix/phoenix:latest
    restart: unless-stopped
    ports:
      - "127.0.0.1:6006:6006"
    volumes:
      - phoenix-data:/data

  tunnel:
    image: cloudflare/cloudflared:latest
    restart: always
    environment:
      - TUNNEL_TOKEN=${CLOUDFLARE_TUNNEL_TOKEN}
    command: tunnel --no-autoupdate run

volumes:
  phoenix-data:
