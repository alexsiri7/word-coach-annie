services:
  app:
    image: ghcr.io/alexsiri7/word-coach-annie:latest
    restart: unless-stopped
    ports:
      - "127.0.0.1:3000:3000"
    env_file:
      - .env.local
    environment:
      - NODE_ENV=production
      - OTEL_ENABLED=true
      - PHOENIX_COLLECTOR_ENDPOINT=http://phoenix:6006/v1/traces
      - "OTEL_EXPORTER_OTLP_TRACES_HEADERS=Authorization=Bearer ${PHOENIX_ADMIN_SECRET:?set PHOENIX_ADMIN_SECRET (see docs/SETUP.md)}"
    depends_on:
      - phoenix
    networks:
      - default
      - telemetry

  phoenix:
    # Pinned to arizephoenix/phoenix:latest as of 2026-05-30 (no stable version tags available)
    # To update: docker pull arizephoenix/phoenix:latest && docker inspect --format='{{index .RepoDigests 0}}'
    image: arizephoenix/phoenix@sha256:91bb10c1217cd1fc0b3ac5908cc8d11f663bc56e00241b7f7551af880d5bcd92
    restart: unless-stopped
    ports:
      - "127.0.0.1:6006:6006"
    environment:
      - PHOENIX_ENABLE_AUTH=True
      - PHOENIX_SECRET=${PHOENIX_SECRET:?set PHOENIX_SECRET (see docs/SETUP.md)}
      - PHOENIX_ADMIN_SECRET=${PHOENIX_ADMIN_SECRET:?set PHOENIX_ADMIN_SECRET (see docs/SETUP.md)}
    volumes:
      - phoenix-data:/data
    networks:
      - telemetry

  tunnel:
    image: cloudflare/cloudflared:2026.10.3@sha256:faa8e0a1475f137c910be6025f43c8e4092fdd35461b31e19fd1390657a1ff39
    restart: always
    environment:
      - TUNNEL_TOKEN=${CLOUDFLARE_TUNNEL_TOKEN}
    command: tunnel --no-autoupdate run
    networks:
      - default
      - reli

networks:
  # Phoenix lives only on telemetry, so the tunnel and reli containers cannot reach it
  telemetry: {}
  reli:
    external: true
    name: reli_default

volumes:
  phoenix-data:
