services:
  app:
    build: .
    ports:
      - "127.0.0.1:3000:3000"
    volumes:
      # Mount source code for hot reload
      - .:/app
      # Prevent node_modules from being overwritten by mount
      - /app/node_modules
      # Persist SQLite database outside the container
      - ./data:/app/data
    environment:
      - NODE_ENV=development
      - DATABASE_URL=file:/app/data/word-coach-annie.db
    command: /app/scripts/start-docker.sh

  tunnel:
    image: cloudflare/cloudflared:latest
    restart: always
    environment:
      - TUNNEL_TOKEN=${CLOUDFLARE_TUNNEL_TOKEN}
    command: tunnel --no-autoupdate run
