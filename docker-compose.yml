services:
  app:
    image: ghcr.io/alexsiri7/word-coach-annie:latest
    restart: unless-stopped
    ports:
      - "127.0.0.1:3000:3000"
    env_file:
      - .env.local
    environment:
      - NODE_ENV=production
      - OTEL_ENABLED=true
      - PHOENIX_COLLECTOR_ENDPOINT=http://phoenix:6006/v1/traces
    depends_on:
      - phoenix

  phoenix:
    image: arizephoenix/phoenix@sha256:91bb10c1217cd1fc0b3ac5908cc8d11f663bc56e00241b7f7551af880d5bcd92
    restart: unless-stopped
    ports:
      - "127.0.0.1:6006:6006"
    volumes:
      - phoenix-data:/data

  tunnel:
    image: cloudflare/cloudflared:2026.5.2
    restart: always
    environment:
      - TUNNEL_TOKEN=${CLOUDFLARE_TUNNEL_TOKEN}
    command: tunnel --no-autoupdate run
    networks:
      - default
      - reli

networks:
  reli:
    external: true
    name: reli_default

volumes:
  phoenix-data:
